name: Firmware build

on:
  push:
    branches: [main]
    paths:
      - "firmware/**"
      - ".github/workflows/firmware-build.yml"
  pull_request:
    branches: [main]
    paths:
      - "firmware/**"
      - ".github/workflows/firmware-build.yml"
  workflow_dispatch: {}
  workflow_call: {}

permissions:
  contents: read

jobs:
  compile-esp32:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 platform and sketch libraries
        run: |
          # The Arduino package/library indexes occasionally download but fail
          # to initialize on the first attempt. Retry transient index/install
          # failures before failing the firmware check.
          arduino-cli config init --overwrite
          retry() {
            attempt=1
            until "$@"; do
              if [ "$attempt" -ge 3 ]; then
                echo "Command failed after 3 attempts: $*"
                return 1
              fi
              echo "Attempt $attempt failed; retrying in $((attempt * 3)) seconds: $*"
              sleep $((attempt * 3))
              attempt=$((attempt + 1))
            done
          }
          retry arduino-cli core update-index
          retry arduino-cli core install esp32:esp32
          retry arduino-cli lib update-index
          retry arduino-cli lib install "Adafruit Fingerprint Sensor Library"
          retry arduino-cli lib install "MFRC522"

      - name: Compile maintained DSIS ESP32 firmware
        run: |
          mkdir -p build/firmware
          arduino-cli compile --warnings all --fqbn esp32:esp32:esp32 --output-dir build/firmware firmware/ESP32_DSIS_AllInOne

      - name: Verify compiled firmware images
        run: |
          find build/firmware -maxdepth 1 -type f -name '*.bin' -print
          test -n "$(find build/firmware -maxdepth 1 -type f -name '*.bin' -print -quit)"

      - name: Upload compiled firmware images
        uses: actions/upload-artifact@v4
        with:
          name: DSIS-firmware-${{ github.sha }}
          path: build/firmware/*.bin
          if-no-files-found: error
          retention-days: 7
