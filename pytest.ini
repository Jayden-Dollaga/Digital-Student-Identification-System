[pytest]
testpaths = tests
python_files = test_*.py
norecursedirs = python/testing_area .venv .venv-1 build dist .pytest_cache tests/_reference tests/_archives tests/manual_hardware_scripts tests/Prototype
markers =
    unit: fast, no external dependencies (db/session/parsing logic in isolation)
    integration: exercises multiple real components together (db + api + settings, etc.)
    ui_qt: instantiates a real PySide6 QApplication (archived v2 Qt UI)
    ui_tk: instantiates real customtkinter/tkinter widgets (archived v1 UI)
    hardware: requires a physically connected ESP32/AS608 device to pass
