<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DSIS Logo</title>
  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      display: grid;
      place-items: center;
      background: transparent;
    }

    svg {
      display: block;
      width: min(90vmin, 512px);
      height: min(90vmin, 512px);
    }
  </style>
</head>
<body>
  <svg viewBox="0 0 22 22" role="img" aria-label="DSIS fingerprint logo" xmlns="http://www.w3.org/2000/svg">
    <circle cx="11" cy="11" r="10.5" fill="#1B2A4A" stroke="#3B78FF" stroke-width="1"/>
    <path d="M11 6a5 5 0 0 0-5 5" stroke="#3B78FF" stroke-width="1.4" stroke-linecap="round" fill="none"/>
    <path d="M11 8a3 3 0 0 0-3 3" stroke="#3B78FF" stroke-width="1.4" stroke-linecap="round" fill="none"/>
    <circle cx="11" cy="11" r="1" fill="#3B78FF"/>
    <path d="M14 11a3 3 0 0 1-3 3" stroke="#3B78FF" stroke-width="1.4" stroke-linecap="round" fill="none"/>
    <path d="M16 11a5 5 0 0 1-5 5" stroke="#3B78FF" stroke-width="1.4" stroke-linecap="round" fill="none"/>
    <path d="M11 6a5 5 0 0 1 5 5" stroke="#3B78FF" stroke-width="1.4" stroke-linecap="round" fill="none"/>
  </svg>
</body>
</html>
